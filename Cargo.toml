[package]
name = "mc-locate"
version = "0.4.0"
edition = "2024"
description = "Reverse-engineer Minecraft Java Edition seeds and coordinates from limited in-game observations"
license = "MIT"
repository = "https://github.com/LAOUUUUU/mc-locate"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
csv = "1.4.0"
cubiomes = { version = "0.3.3", default-features = false, features = ["cc_build"] }
dialoguer = "0.12.0"
image = "0.25.10"
imageproc = "0.27.0"
indicatif = "0.18.6"
nalgebra = "0.35.0"
notify = "8.2.0"
rayon = "1.12.0"
regex = "1.13.1"

# OCR (mode 3) needs system Tesseract + Leptonica. Off by default so the rest
# of the tool builds on a machine that doesn't have them:
#   brew install tesseract leptonica pkg-config
#   cargo build --release --features ocr
leptess = { version = "0.14.0", optional = true }
cubiomes-sys = { version = "0.1.3", default-features = false, features = ["cc_build"] }
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["std", "num-bigint"] }
num-traits = "0.2.19"
num-integer = "0.1.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
console = "0.16.4"

[features]
default = []
ocr = ["dep:leptess"]

[dev-dependencies]
ab_glyph = "0.2.32"
# Independent third-party implementation of the Java LCG, used only to
# cross-check our own random.rs in tests.
java_random = "0.1.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
