name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A newer runner is needed because macos-14's clang rejects the loot tables'
  # static initialisers as non-constant. Pin the deployment target so the newer
  # SDK does not quietly raise the minimum macOS the binaries will run on.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # cubiomes-sys runs bindgen over the vendored C headers, so every
      # platform needs libclang available at build time.
      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Locate libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          # The cubiomes C uses variable-length arrays and variably-modified
          # pointer types — standard C99, but MSVC has never implemented them
          # and errors out. clang-cl accepts them while still targeting the
          # MSVC ABI, so the resulting binary is an ordinary MSVC-linked exe.
          "CC_x86_64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
          # -ffunction-sections puts each function in its own COMDAT so the
          # linker's /OPT:REF can discard the unreferenced ones. That matters
          # because the fork calls getEndCityPieces and getStrongholdLoot
          # without ever defining them — macOS and Linux dead-strip the callers
          # before resolving, MSVC's linker does not.
          "CFLAGS_x86_64_pc_windows_msvc=-Wno-vla-extension -ffunction-sections" >> $env:GITHUB_ENV
          "RUSTFLAGS=-C link-arg=/OPT:REF" >> $env:GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: cargo clippy --release --all-targets --locked -- -D warnings
