name: Release

# Tag a version to publish binaries:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than separate Intel and Apple Silicon
          # builds: GitHub's Intel macOS runners are being retired and jobs
          # requesting them sit queued indefinitely. Apple's toolchain
          # cross-compiles to x86_64 from Apple Silicon without extra setup, so
          # `lipo` can fuse both slices into a single download that works on
          # every Mac.
          - os: macos-14
            target: universal-apple-darwin
            label: macos-universal
          # 22.04 rather than latest: binaries link against its older glibc,
          # so they also run on distributions a few years behind.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Locate libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Add target
        if: matrix.target != 'universal-apple-darwin'
        run: rustup target add ${{ matrix.target }}

      - name: Build
        if: matrix.target != 'universal-apple-darwin'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build universal macOS binary
        if: matrix.target == 'universal-apple-darwin'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/mc-locate \
            target/aarch64-apple-darwin/release/mc-locate \
            target/x86_64-apple-darwin/release/mc-locate
          lipo -info target/universal-apple-darwin/release/mc-locate

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mc-locate dist/
          cp README.md dist/
          tar -czf mc-locate-${{ matrix.label }}.tar.gz -C dist .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/mc-locate.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath mc-locate-${{ matrix.label }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mc-locate-${{ matrix.label }}
          path: mc-locate-${{ matrix.label }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Uses the preinstalled gh CLI rather than a third-party release action.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "mc-locate ${GITHUB_REF_NAME}" \
            --notes "Prebuilt binaries for macOS (Apple Silicon and Intel), Linux x86_64 and Windows x86_64. See README.md for what each mode needs." \
            artifacts/*.tar.gz artifacts/*.zip
