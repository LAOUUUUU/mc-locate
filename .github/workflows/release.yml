name: Release

# Tag a version to publish binaries:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A newer runner is needed because macos-14's clang rejects the loot tables'
  # static initialisers as non-constant. Pin the deployment target so the newer
  # SDK does not quietly raise the minimum macOS the binaries will run on.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than separate Intel and Apple Silicon
          # builds: GitHub's Intel macOS runners are being retired and jobs
          # requesting them sit queued indefinitely. Apple's toolchain
          # cross-compiles to x86_64 from Apple Silicon without extra setup, so
          # `lipo` can fuse both slices into a single download that works on
          # every Mac.
          - os: macos-15
            target: universal-apple-darwin
            label: macos-universal
          # 22.04 rather than latest: binaries link against its older glibc,
          # so they also run on distributions a few years behind.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Locate libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          # The cubiomes C uses variable-length arrays and variably-modified
          # pointer types — standard C99, but MSVC has never implemented them
          # and errors out. clang-cl accepts them while still targeting the
          # MSVC ABI, so the resulting binary is an ordinary MSVC-linked exe.
          "CC_x86_64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
          # -ffunction-sections puts each function in its own COMDAT so the
          # linker's /OPT:REF can discard the unreferenced ones. That matters
          # because the fork calls getEndCityPieces and getStrongholdLoot
          # without ever defining them — macOS and Linux dead-strip the callers
          # before resolving, MSVC's linker does not.
          "CFLAGS_x86_64_pc_windows_msvc=-Wno-vla-extension -ffunction-sections" >> $env:GITHUB_ENV
          "RUSTFLAGS=-C link-arg=/OPT:REF" >> $env:GITHUB_ENV

      - name: Add target
        if: matrix.target != 'universal-apple-darwin'
        run: rustup target add ${{ matrix.target }}

      - name: Build
        if: matrix.target != 'universal-apple-darwin'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build universal macOS binary
        if: matrix.target == 'universal-apple-darwin'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/mc-locate \
            target/aarch64-apple-darwin/release/mc-locate \
            target/x86_64-apple-darwin/release/mc-locate
          lipo -info target/universal-apple-darwin/release/mc-locate

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mc-locate dist/
          cp README.md LICENSE dist/
          tar -czf mc-locate-${{ matrix.label }}.tar.gz -C dist .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/mc-locate.exe dist/
          Copy-Item README.md,LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath mc-locate-${{ matrix.label }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mc-locate-${{ matrix.label }}
          path: mc-locate-${{ matrix.label }}.*

  # The exporter mod ships alongside the CLI so the "grab the jar for your
  # version" table in its README is actually actionable — one jar per supported
  # Minecraft version, built from the same tag.
  mod:
    name: exporter mod jars
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jar-dev/mc-locate-exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Cache Gradle & Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-mod-${{ hashFiles('jar-dev/mc-locate-exporter/**/*.gradle.kts', 'jar-dev/mc-locate-exporter/**/*.toml', 'jar-dev/mc-locate-exporter/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-mod-
      - run: ./gradlew build --no-daemon --console=plain --stacktrace
      - name: Collect version jars
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          find versions -path '*/build/libs/*.jar' ! -name '*-sources.jar' \
            -exec cp {} "${GITHUB_WORKSPACE}/artifacts/" \;
          ls -la "${GITHUB_WORKSPACE}/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: artifacts/*.jar
          if-no-files-found: error

  publish:
    needs: [build, mod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Uses the preinstalled gh CLI rather than a third-party release action.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "mc-locate ${GITHUB_REF_NAME}" \
            --notes "Prebuilt CLI binaries for macOS (Apple Silicon and Intel), Linux x86_64 and Windows x86_64, plus the Fabric exporter mod for every supported Minecraft version (1.21-1.21.11, 26.1.x, 26.2). See README.md for the CLI, and jar-dev/mc-locate-exporter/README.md for which mod jar to grab." \
            artifacts/*.tar.gz artifacts/*.zip artifacts/*.jar
